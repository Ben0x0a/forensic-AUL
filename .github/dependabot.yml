# Keep the SHA-pinned GitHub Actions (and Python deps) up to date automatically.
# Dependabot opens PRs that bump the pinned SHAs and refresh the version comments.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
