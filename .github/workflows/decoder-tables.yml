# Keep the os_log decoder tables in sync with the upstream Mandiant source.
#
# The generator (scripts/gen_decoders.py) fetches src/decoders/ straight from the
# Mandiant macos-unifiedlogs GitHub repo — nothing is vendored here — so both jobs
# need network access and use GITHUB_TOKEN to lift the anonymous API rate limit.
#
# Two jobs:
#   - check    : on every push / PR that touches the generator or the generated
#                module, regenerate from upstream and fail if the committed
#                forensic_aul/engine/parser/decoder_tables.py differs (i.e. the
#                generator changed without refreshing the module, or the module
#                was hand-edited).
#   - refresh  : on a weekly schedule (or manual dispatch), regenerate from
#                upstream and open a PR if anything changed — so new upstream
#                decoders are picked up without manual copying.
#
# Third-party actions are pinned to a full commit SHA (with a version comment),
# per the project's CI rules. The generator is stdlib-only; it is run through the
# project's uv environment for a consistent Python.
#
# Attribution: the tables are derived from Mandiant macos-unifiedlogs (Apache-2.0)
# — see THIRD_PARTY_NOTICES.md and the generated module header.

name: decoder-tables

on:
  push:
    paths:
      - "scripts/gen_decoders.py"
      - "forensic_aul/engine/parser/decoder_tables.py"
  pull_request:
    paths:
      - "scripts/gen_decoders.py"
      - "forensic_aul/engine/parser/decoder_tables.py"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tables up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify decoder_tables.py is regenerated
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/gen_decoders.py --check

  refresh:
    name: regenerate & open PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Regenerate decoder tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/gen_decoders.py
      - name: Open a PR if the tables changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- forensic_aul/engine/parser/decoder_tables.py; then
            echo "Decoder tables already up to date."
            exit 0
          fi
          branch="auto/decoder-tables-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add forensic_aul/engine/parser/decoder_tables.py
          git commit -m "chore(decoders): refresh os_log tables from upstream (Apache-2.0)"
          git push -u origin "$branch"
          gh pr create \
            --title "Refresh os_log decoder tables" \
            --body "Auto-generated by \`scripts/gen_decoders.py\` from the upstream Mandiant macos-unifiedlogs source (Apache-2.0). See THIRD_PARTY_NOTICES.md." \
            --label dependencies || true
