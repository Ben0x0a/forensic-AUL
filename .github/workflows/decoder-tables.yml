# Keep the os_log decoder tables in sync with the upstream Mandiant source.
#
# The generator (scripts/gen_decoders.py) fetches src/decoders/ straight from the
# Mandiant macos-unifiedlogs GitHub repo — nothing is vendored here — so both jobs
# need network access and use GITHUB_TOKEN to lift the anonymous API rate limit.
#
# Two jobs:
#   - check    : on every push / PR that touches the generator or the generated
#                module, regenerate from upstream and fail if the committed
#                forensic_aul/engine/parser/decoder_tables.py differs (i.e. the
#                generator changed without refreshing the module, or the module
#                was hand-edited).
#   - refresh  : on a weekly schedule (or manual dispatch), regenerate from
#                upstream and open a PR if anything changed — so new upstream
#                decoders are picked up without manual copying.
#
# Third-party actions are pinned to a full commit SHA (with a version comment),
# per the project's CI rules. The generator is stdlib-only; it is run through the
# project's uv environment for a consistent Python.
#
# Attribution: the tables are derived from Mandiant macos-unifiedlogs (Apache-2.0)
# — see THIRD_PARTY_NOTICES.md and the generated module header.

name: decoder-tables

on:
  push:
    paths:
      - "scripts/gen_decoders.py"
      - "forensic_aul/engine/parser/decoder_tables.py"
  pull_request:
    paths:
      - "scripts/gen_decoders.py"
      - "forensic_aul/engine/parser/decoder_tables.py"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tables up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Verify decoder_tables.py is regenerated
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/gen_decoders.py --check

  refresh:
    name: regenerate & open PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Regenerate decoder tables
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/gen_decoders.py
      - name: Open a PR if the tables changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- forensic_aul/engine/parser/decoder_tables.py; then
            echo "Decoder tables already up to date."
            exit 0
          fi
          branch="auto/decoder-tables-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add forensic_aul/engine/parser/decoder_tables.py
          git commit -m "chore(decoders): refresh os_log tables from upstream (Apache-2.0)"
          git push -u origin "$branch"

          # WHY no "|| true" here: it used to swallow the failure, and the job
          # then "succeeded" having pushed a branch nobody ever saw. Five orphan
          # branches accumulated between 2026-08-24 and 2026-09-21 before anyone
          # noticed, and the 0.6.0 -> 0.7.0 table refresh sat unmerged the whole
          # time. A refresh that cannot be surfaced is a failure, so say so.
          if ! gh pr create \
            --title "Refresh os_log decoder tables" \
            --body "Auto-generated by \`scripts/gen_decoders.py\` from the upstream Mandiant macos-unifiedlogs source (Apache-2.0). See THIRD_PARTY_NOTICES.md." \
            --label dependencies; then
            echo "::error::Pushed $branch but could not open a PR for it."
            echo "::error::Most likely cause: Settings -> Actions -> General ->"
            echo "::error::Workflow permissions -> 'Allow GitHub Actions to create"
            echo "::error::and approve pull requests' is disabled for this repo."
            exit 1
          fi

          # Retire every superseded refresh branch. The tables are ONE generated
          # file, so an older auto branch is strictly stale once this one is open
          # — keeping them just hides which refresh is current. Deleting a branch
          # closes its PR, which is the intended outcome for a superseded one.
          # Runs only after the PR above exists, so a failure never leaves the
          # repo with neither the old branch nor a new PR.
          git ls-remote --heads origin 'refs/heads/auto/decoder-tables-*' \
            | awk '{print $2}' | sed 's#refs/heads/##' \
            | while read -r stale; do
                if [ "$stale" != "$branch" ]; then
                  echo "Retiring superseded refresh branch: $stale"
                  git push origin --delete "$stale"
                fi
              done
