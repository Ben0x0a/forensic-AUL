# Continuous integration — lint, then the fast test suites (unit + parser) on
# every supported Python (Linux) and on macOS.
#
# Third-party actions are pinned to a full commit SHA (with a trailing version
# comment) per the project's CI rules; Dependabot (.github/dependabot.yml) bumps
# them. Builds are reproducible: `uv run --frozen` resolves from the committed
# uv.lock and fails if the lock is stale.
#
# WHY a macOS job: macOS-only paths run there (Apple's `log` tooling and, for
# iOS 27 archives, the libcompression cross-check of the LZBITMAP decoder).
#
# Integration tests are intentionally excluded — they need the large sample
# acquisitions in tests/data/ (not in the repo) and take ~40 min. The parser
# suite skips its data-dependent tests when that data is absent.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Ruff (rule set pinned in pyproject.toml)
        run: uv run --frozen --extra dev ruff check .

  unit:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Run unit and parser tests
        run: uv run --frozen --python ${{ matrix.python-version }} --extra dev pytest tests/unit tests/parser -q
